<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title description">
  <title id="title">Efficient RAG architecture for AI Shopping OS</title>
  <desc id="description">Architecture diagram showing user requests flowing through the Next.js UI and API to intent and query routing, parallel structured Prisma retrieval and semantic RAG retrieval, MARE ranking, grounded response generation, and persistence. A separate offline indexing pipeline updates a persistent vector store from the product catalog and review knowledge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#111d32"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #e5eefb; }
      .title { font-size: 34px; font-weight: 750; letter-spacing: .2px; }
      .subtitle { font-size: 16px; fill: #9fb2cc; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.6px; fill: #7dd3fc; }
      .box-title { font-size: 18px; font-weight: 700; }
      .body { font-size: 14px; fill: #bdcce0; }
      .small { font-size: 12px; fill: #9fb2cc; }
      .note-title { font-size: 15px; font-weight: 700; }
      .box { fill: #14243a; stroke: #38516f; stroke-width: 1.5; }
      .box-blue { fill: #102c43; stroke: #38bdf8; stroke-width: 1.8; }
      .box-purple { fill: #24213f; stroke: #a78bfa; stroke-width: 1.8; }
      .box-green { fill: #132f32; stroke: #4ade80; stroke-width: 1.8; }
      .box-amber { fill: #332b1c; stroke: #fbbf24; stroke-width: 1.6; }
      .line { fill: none; stroke: #7dd3fc; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-green { fill: none; stroke: #86efac; stroke-width: 2; marker-end: url(#arrowGreen); }
      .dashed { stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1600" height="1050" rx="0" fill="url(#bg)"/>
  <circle cx="1435" cy="105" r="220" fill="#2563eb" opacity=".07"/>
  <circle cx="150" cy="920" r="260" fill="#06b6d4" opacity=".045"/>
  <text x="64" y="66" class="title">AI Shopping OS · Efficient RAG Architecture</text>
  <text x="64" y="96" class="subtitle">Grounded shopping answers, exact live facts, personalized ranking, and incremental knowledge indexing</text>

  <text x="64" y="145" class="section">ONLINE REQUEST PATH · PER USER QUERY</text>

  <rect x="64" y="180" width="210" height="105" rx="14" class="box"/>
  <text x="84" y="214" class="box-title">Shopper / UI</text>
  <text x="84" y="241" class="body">Next.js + React</text>
  <text x="84" y="263" class="small">Chat, search, compare</text>

  <rect x="330" y="180" width="235" height="105" rx="14" class="box-blue"/>
  <text x="350" y="214" class="box-title">API + Auth</text>
  <text x="350" y="241" class="body">Next.js route handler</text>
  <text x="350" y="263" class="small">Validate · authenticate · limit</text>

  <rect x="620" y="180" width="260" height="105" rx="14" class="box-purple"/>
  <text x="640" y="214" class="box-title">Intent + Query Router</text>
  <text x="640" y="241" class="body">Extract category, brand, budget</text>
  <text x="640" y="263" class="small">Skip RAG for greeting / exact price</text>

  <path d="M274 232 H320" class="line"/>
  <path d="M565 232 H610" class="line"/>

  <text x="1130" y="145" class="section">RETRIEVAL · IN PARALLEL WHEN NEEDED</text>
  <rect x="955" y="180" width="260" height="138" rx="14" class="box-blue"/>
  <text x="977" y="214" class="box-title">Structured Retrieval</text>
  <text x="977" y="242" class="body">Prisma / SQLite catalog</text>
  <text x="977" y="265" class="small">Exact budget, price, stock, delivery</text>
  <text x="977" y="287" class="small">Fetch current facts by product ID</text>

  <rect x="1270" y="180" width="266" height="138" rx="14" class="box-green"/>
  <text x="1292" y="214" class="box-title">Semantic Retrieval</text>
  <text x="1292" y="242" class="body">Persistent vector store</text>
  <text x="1292" y="265" class="small">Top-K product / review evidence</text>
  <text x="1292" y="287" class="small">Filter metadata; dedupe by product</text>

  <path d="M880 220 H925 V244 H945" class="line"/>
  <path d="M880 246 H1238 V244 H1260" class="line"/>

  <rect x="1085" y="363" width="320" height="100" rx="14" class="box"/>
  <text x="1108" y="397" class="box-title">Candidate Merge + Evidence</text>
  <text x="1108" y="424" class="body">Union IDs · enforce hard filters</text>
  <text x="1108" y="446" class="small">Keep source IDs and retrieval scores</text>
  <path d="M1085 318 V343 H1168 V353" class="line"/>
  <path d="M1402 318 V343 H1320 V353" class="line"/>

  <rect x="730" y="515" width="300" height="112" rx="14" class="box-purple"/>
  <text x="754" y="551" class="box-title">MARE Ranking</text>
  <text x="754" y="579" class="body">Score candidates for this shopper</text>
  <text x="754" y="603" class="small">Memory + twin + specs + price fit</text>

  <rect x="1085" y="515" width="320" height="112" rx="14" class="box-blue"/>
  <text x="1108" y="551" class="box-title">Grounded Answer</text>
  <text x="1108" y="579" class="body">LLM explains ranked products</text>
  <text x="1108" y="603" class="small">Evidence only · cite product/source IDs</text>

  <path d="M1160 463 V489 H880 V505" class="line"/>
  <path d="M1030 571 H1075" class="line"/>

  <rect x="330" y="515" width="320" height="112" rx="14" class="box"/>
  <text x="354" y="551" class="box-title">User Memory + Digital Twin</text>
  <text x="354" y="579" class="body">Prisma, scoped to authenticated user</text>
  <text x="354" y="603" class="small">Personalize ranking; never mix users</text>
  <path d="M490 285 V380 H370 V505" class="line"/>
  <path d="M650 571 H720" class="line"/>

  <rect x="1085" y="687" width="320" height="85" rx="14" class="box"/>
  <text x="1108" y="721" class="box-title">Persist + Respond</text>
  <text x="1108" y="748" class="body">Chat, recs, sources, latency</text>
  <path d="M1245 627 V677" class="line"/>

  <rect x="64" y="687" width="900" height="85" rx="14" class="box-amber"/>
  <text x="88" y="721" class="note-title">Efficiency and safety guardrails</text>
  <text x="88" y="748" class="body">Small Top-K · strict token cap · cache shared embeddings · confidence threshold · never trust retrieved text as instructions</text>
  <path d="M1085 730 H974" class="line dashed"/>

  <line x1="64" y1="815" x2="1536" y2="815" stroke="#38516f" stroke-width="1.2"/>
  <text x="64" y="855" class="section">OFFLINE / BACKGROUND INDEXING · NOT ON THE USER REQUEST PATH</text>

  <rect x="64" y="886" width="245" height="112" rx="14" class="box"/>
  <text x="86" y="921" class="box-title">Catalog + Knowledge</text>
  <text x="86" y="949" class="body">Products · specs · reviews</text>
  <text x="86" y="973" class="small">Prisma / approved sources</text>

  <rect x="374" y="886" width="245" height="112" rx="14" class="box-blue"/>
  <text x="396" y="921" class="box-title">Change Detector</text>
  <text x="396" y="949" class="body">New / changed / deleted data</text>
  <text x="396" y="973" class="small">Stable IDs + content hash</text>

  <rect x="684" y="886" width="245" height="112" rx="14" class="box-purple"/>
  <text x="706" y="921" class="box-title">Chunk + Embed</text>
  <text x="706" y="949" class="body">Semantic model · batched</text>
  <text x="706" y="973" class="small">Re-embed changed chunks only</text>

  <rect x="994" y="886" width="245" height="112" rx="14" class="box-green"/>
  <text x="1016" y="921" class="box-title">Persistent Index</text>
  <text x="1016" y="949" class="body">Vector + metadata filters</text>
  <text x="1016" y="973" class="small">Upsert / delete / version</text>

  <rect x="1304" y="886" width="232" height="112" rx="14" class="box"/>
  <text x="1326" y="921" class="box-title">Operations</text>
  <text x="1326" y="949" class="body">Reindex · health · metrics</text>
  <text x="1326" y="973" class="small">Backfill / rollback / monitor</text>

  <path d="M309 942 H364" class="line-green"/>
  <path d="M619 942 H674" class="line-green"/>
  <path d="M929 942 H984" class="line-green"/>
  <path d="M1239 942 H1294" class="line-green"/>
  <path d="M1120 886 V824 H1400 V328" class="line-green dashed"/>

  <text x="64" y="1030" class="small">Principle: Prisma owns live structured truth · RAG finds relevant language evidence · MARE decides product fit · LLM communicates supported results.</text>
</svg>
